name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with shared DeepSeek config
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_MODEL_NAME: ${{ vars.VITE_MODEL_NAME }}
          VITE_SEND_IMAGES: ${{ vars.VITE_SEND_IMAGES }}
          VITE_LOCK_API_SETTINGS: ${{ vars.VITE_LOCK_API_SETTINGS }}
        run: |
          export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://api.deepseek.com/v1}"
          export VITE_MODEL_NAME="${VITE_MODEL_NAME:-deepseek-flash}"
          export VITE_SEND_IMAGES="${VITE_SEND_IMAGES:-true}"
          export VITE_LOCK_API_SETTINGS="${VITE_LOCK_API_SETTINGS:-true}"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
